[project]
name = "pairprogrammer"
version = "0.1.0"
description = "Backend for pairprogrammer: spoken briefings on work items and specs."
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi (>=0.162.0,<0.163.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "httpx (>=0.28,<0.29)"]

[tool.poetry]
packages = [{ include = "pairprogrammer", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
]
