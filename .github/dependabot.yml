# Monthly version updates. `cooldown` makes Dependabot wait 14 days after a
# release before proposing it, which keeps freshly published (possibly
# compromised) versions out. Minor and patch updates are grouped into one PR
# per ecosystem; majors stay separate. Dependabot PRs get no repo secrets, so
# the AI review skips them. Poetry projects use the `pip` ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
